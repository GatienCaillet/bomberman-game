      <header class="topbar">

        <!-- ==== 导航：链接跳转到独立排行榜页 / Navigation : lien vers la page du classement ==== -->
        <nav class="top-nav" aria-label="Navigation principale">
          <a href="classement.html">CLASSEMENT ↗</a>
        </nav>
      </header>
      <section class="menu" aria-labelledby="game-title">
        <h1 id="game-title" class="menu-heading">
          <span class="sr-only">Grenoble Bomber</span
          ><img
            class="title-art"
            src="ressources/interface/titres/01-titre-accueil.png"
            alt=""
            width="768"
            height="258"
          />
        </h1>
        <p class="menu-kicker">ÇA VA FAIRE BOUM.</p>
        <p class="intro">Choisis un pseudo. Garde une issue.</p>
        <!-- ==== 欢迎页输入：#nickname 由 ui.js 读取 / Saisie : ui.js lit #nickname ==== -->
        <form id="join-form" class="nickname-form" novalidate>
          <label for="nickname">TON PSEUDO DE LÉGENDE</label>
          <div class="input-wrap">
            <input
              id="nickname"
              name="nickname"
              type="text"
              placeholder="Baguette.exe"
              maxlength="20"
              autocomplete="nickname"
              required
              aria-describedby="message"
            />
          </div>
          <!-- ==== 开始按钮：提交 #join-form，调用 ui.js 的 submit 处理 / Démarrer : soumettre #join-form ==== -->
          <button class="pixel-button" type="submit">
            <span>C’EST PARTI !</span><span class="button-arrow" aria-hidden="true">▶</span>
          </button>
        </form>
        <!-- ==== 排行榜按钮：classement.js 监听此入口并调用 open() / Classement : ouvrir via classement.js ==== -->
        <button class="secondary-button" id="score-button" type="button" data-scoreboard-open>
          <span aria-hidden="true">★</span> LE TABLEAU DES HÉROS
        </button>
        <!-- ==== 动态显示：ui.js 的 showMessage() 更新 #message / Affichage : showMessage() actualise #message ==== -->
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <p class="menu-footnote">
          UN PETIT JEU. UN GRAND BAZAR.<br />Prototype local · salon de jeu à connecter
        </p>
      </section>
